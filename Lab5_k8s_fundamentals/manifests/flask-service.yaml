apiVersion: v1
kind: Service
metadata:
  name: flask-service
  labels:
    app: flask-service
spec:
  # Type NodePort exposes the service on each Node's IP at a static port
  type: NodePort
  selector:
    app: flask-deploy-pod
  ports:
    - protocol: TCP
      port: 80         # Port exposed inside the cluster
      targetPort: 80 # Container port Flask is running on
      nodePort: 30080  # Port accessible externally from host node (Minikube VM)
