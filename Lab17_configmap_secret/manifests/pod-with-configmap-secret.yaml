apiVersion: v1
kind: Pod
metadata:
  name: demo-configmap-secret-pod
  namespace: analytics-dev
  labels:
    app: config-secret-demo
spec:
  containers:
    - name: demo-container
      image: nginx:alpine
      imagePullPolicy: Never  # Use local minikube loaded image
      envFrom:
        - configMapRef:
            name: app-config
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: app-secret
