apiVersion: v1
kind: Pod
metadata:
  name: spark-executor-template
  labels:
    app.kubernetes.io/component: executor
    tier: spark-snowflake-executor
spec:
  containers:
    - name: spark-kubernetes-executor
      imagePullPolicy: Always
      envFrom:
        - configMapRef:
            name: app-config
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: app-secret
