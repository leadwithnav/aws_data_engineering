apiVersion: v1
kind: Pod
metadata:
  name: spark-driver-template
spec:
  # Target nodes labeled dedicated=spark (Node 3)
  nodeSelector:
    dedicated: spark
  # Tolerate the taint on Node 3 so scheduling is allowed
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "spark"
      effect: "NoSchedule"
  containers:
    - name: spark-driver
      image: spark-container-demo:latest
