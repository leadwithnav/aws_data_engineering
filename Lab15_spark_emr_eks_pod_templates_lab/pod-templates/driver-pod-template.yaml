apiVersion: v1
kind: Pod
metadata:
  name: spark-driver-template
  labels:
    app.kubernetes.io/name: spark-job
    app.kubernetes.io/component: driver
    tier: analytics-driver
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4040"
    prometheus.io/path: "/metrics/executors/prometheus"
    cluster.autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  nodeSelector:
    role: spark-driver-nodes
  tolerations:
    - key: "spark-workload"
      operator: "Exists"
      effect: "NoSchedule"
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: spark-kubernetes-driver
      imagePullPolicy: Always
      env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: SPARK_DRIVER_MEMORY
          value: "1024m"
      resources:
        requests:
          cpu: "1000m"
          memory: "1024Mi"
        limits:
          cpu: "2000m"
          memory: "2048Mi"
      volumeMounts:
        - name: driver-spark-local-dir
          mountPath: /data/spark-scratch
  volumes:
    - name: driver-spark-local-dir
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
