apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: emr-containers-role
  namespace: emr-jobs
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "configmaps", "persistentvolumeclaims", "pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "describe", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["create", "get", "list", "watch", "describe", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "describe", "update", "patch", "delete"]
  - apiGroups: ["extensions"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "describe", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: emr-containers-role-binding
  namespace: emr-jobs
subjects:
  - kind: User
    name: emr-containers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: emr-containers-role
  apiGroup: rbac.authorization.k8s.io
