apiVersion: v1
kind: Pod
metadata:
  name: httpd-frontend
  labels:
    app: httpd-frontend
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: tier
                operator: In
                values:
                  - frontend
  containers:
    - name: httpd
      image: httpd:alpine
      ports:
        - containerPort: 80
